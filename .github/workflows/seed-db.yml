name: Seed Database (manual)

on:
  workflow_dispatch:

jobs:
  seed-db:
    runs-on: ubuntu-latest
    env:
      DB_DRIVER: ${{ secrets.DB_DRIVER }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql,pdo_sqlite

      - name: Install mysql client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      - name: Create database (if mysql)
        if: env.DB_DRIVER == 'mysql'
        run: |
          echo "Creating database if not exists..."
          mysql -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$DB_USER" -p"$DB_PASS" -e "CREATE DATABASE IF NOT EXISTS \`$DB_NAME\`;"

      - name: Apply schema (mysql)
        if: env.DB_DRIVER == 'mysql'
        run: |
          echo "Applying schema to $DB_NAME"
          mysql -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$DB_USER" -p"$DB_PASS" "$DB_NAME" < database/bank_sampah.sql

      - name: Run PHP seeders
        run: |
          php -v
          php database/seed/seed_admin.php || true
          php database/seed/seed_waste_types.php || true
